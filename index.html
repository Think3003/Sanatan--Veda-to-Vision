<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sanatan - Itihasa & Dharma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Cinzel', 'serif'],
              scripture: ['"Crimson Pro"', 'serif'],
            },
            colors: {
              history: {
                950: '#0c0a09', // Stone 950 (Warm Black)
                900: '#1c1917', // Stone 900
                850: '#292524', // Stone 800
                800: '#44403c', // Stone 700
              },
              saffron: {
                400: '#fb923c', // Orange 400
                500: '#f97316', // Orange 500 (Base Saffron)
                600: '#ea580c', // Orange 600
                700: '#c2410c', // Orange 700
                900: '#7c2d12', // Deep Rust
              },
              gold: {
                400: '#facc15', // Yellow 400
                500: '#eab308', // Yellow 500 (Base Gold)
                600: '#ca8a04', // Yellow 600 (Dark Gold)
                900: '#713f12', // Bronze
              },
              parchment: {
                100: '#f5f5f4',
                200: '#e7e5e4',
                300: '#d6d3d1',
                DEFAULT: '#e6d5c3', // Custom warm parchment
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'slide-up': 'slideUp 0.5s ease-out',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(10px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom Scrollbar for Webkit */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1c1917; 
      }
      ::-webkit-scrollbar-thumb {
        background: #44403c; 
        border-radius: 4px;
        border: 1px solid #1c1917;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ca8a04; 
      }
      body {
        background-color: #0c0a09;
        overscroll-behavior: none; /* Prevent bounce effects on mobile */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-history-950 text-parchment-DEFAULT antialiased h-full w-full overflow-hidden selection:bg-saffron-900 selection:text-saffron-100 fixed inset-0">
    <div id="root" class="h-full w-full"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
